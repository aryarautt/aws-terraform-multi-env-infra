###############################################################################
# TERRAFORM PLAN - runs on every pull request
#
# This is the review gate. It formats, validates and plans every
# environment, then posts the plan as a comment on the PR so a human can
# read exactly what would change BEFORE anything is applied.
#
# AUTHENTICATION - the important part
# -----------------------------------
# There is no AWS access key anywhere in this file or in GitHub Secrets.
#
# GitHub issues a short-lived, signed OIDC token asserting "this is repo X,
# ref Y, workflow Z". AWS validates that signature against GitHub's public
# keys and exchanges it for temporary credentials that expire in under an
# hour. The IAM trust policy pins which repository and which ref may do
# this - see bootstrap/main.tf.
#
# Compare to the old pattern: an IAM user's long-lived access key pasted
# into GitHub Secrets. That key works from anywhere on the internet,
# forever, until someone notices it leaked and rotates it.
###############################################################################

name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "modules/**"
      - "environments/**"
      - "bootstrap/**"
      - ".github/workflows/**"

# Least privilege at the workflow level too.
permissions:
  contents: read
  pull-requests: write # to post the plan comment
  id-token: write # REQUIRED to request the OIDC token

env:
  TF_VERSION: "1.10.0"
  AWS_REGION: ap-south-1

concurrency:
  # Cancel a superseded run when new commits are pushed to the same PR.
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Fast, free checks. No AWS credentials needed at all.
  # ---------------------------------------------------------------------------
  validate:
    name: Format and validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform validate (all modules and environments)
        run: |
          set -e
          for d in modules/*/ environments/*/ bootstrap/; do
            echo "::group::$d"
            # -backend=false validates without needing S3 or credentials.
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done

  # ---------------------------------------------------------------------------
  # Plan each environment in parallel.
  # ---------------------------------------------------------------------------
  plan:
    name: Plan ${{ matrix.environment }}
    runs-on: ubuntu-latest
    needs: validate

    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, production]

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Exchanges the GitHub OIDC token for temporary AWS credentials.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gh-plan-${{ matrix.environment }}-${{ github.run_id }}

      - name: terraform init
        run: terraform -chdir=environments/${{ matrix.environment }} init -input=false

      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform -chdir=environments/${{ matrix.environment }} \
            plan -input=false -no-color -out=tfplan -detailed-exitcode \
            > plan_output.txt 2>&1
          code=$?
          # -detailed-exitcode: 0 = no changes, 1 = error, 2 = changes present
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          cat plan_output.txt
          [ $code -eq 1 ] && exit 1 || exit 0

      - name: Post plan to the pull request
        uses: actions/github-script@v7
        if: always()
        env:
          EXITCODE: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require('fs');
            let plan = '';
            try { plan = fs.readFileSync('plan_output.txt', 'utf8'); }
            catch { plan = 'Plan output unavailable.'; }

            // GitHub comments cap at 65536 characters.
            const MAX = 60000;
            if (plan.length > MAX) {
              plan = plan.slice(0, MAX) + '\n\n... truncated. See the full log in Actions.';
            }

            const code = process.env.EXITCODE;
            const status = code === '0'
              ? 'No changes. Infrastructure matches the configuration.'
              : code === '2'
                ? 'Changes detected. Review carefully before merging.'
                : 'Plan failed.';

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '### Terraform Plan — `${{ matrix.environment }}`',
                '',
                status,
                '',
                '<details><summary>Show plan</summary>',
                '',
                '```terraform',
                plan,
                '```',
                '',
                '</details>',
                '',
                `_Commit ${context.sha.slice(0,7)}_`
              ].join('\n')
            });
