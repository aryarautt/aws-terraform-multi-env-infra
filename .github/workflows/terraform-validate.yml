name: Terraform Validate

# Runs on every push and PR. Needs NO AWS credentials, because
# `terraform init -backend=false` skips backend initialisation entirely.
# That makes this a free, always-available quality gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_VERSION: "1.10.0"

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: Validate all modules
        run: |
          set -e
          for d in modules/*/; do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done

      - name: Validate all environments
        run: |
          set -e
          for d in environments/*/ bootstrap/; do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done
